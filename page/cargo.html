<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof Time Conta - Cadastro</title>
    <link rel="stylesheet" href="../asset/style/base/base-form.css">
    <link rel="stylesheet" href="../asset/style/conta.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <form id="cargoForm" class="form-container" autocomplete="off">

        <div class="field-container">
            <div class="field-group col-0">
                <div class="field-col">
                    <h1 class="header-title" data-translate="lbl_titulo">Cargo</h1>
                </div>
            </div>
        </div>
     
        <div class="field-container">
            <div class="field-group col-0">
                <div class="field-col posicao-end">
                    <button type="button" id="btn-pt" class="lang-btn active">
                            <img class="icon-flag" src="../asset/icon/bandeira-do-brasil.png" alt="Bandeira do Brasil">
                        </button>                   
                        <button type="button" id="btn-es" class="lang-btn">
                            <img class="icon-flag" src="../asset/icon/paraguai.png" alt="Bandeira do Paraguai">
                        </button> 
                </div>
            </div>
        </div>
        
        <div class="field-container">
            <div class="field-group col-0">
                 <div class="field-col">
                    <cargo-field
                        id                     = "cargo"
                        name                   = "cargo"                                
                        data_translate_label   = "lbl_cargo"
                        data_translate_ph      = "ph_cargo"
                        data_translate_tooltip = "tp_lbl_cargo"
                        icon_question          = "fa-solid fa-circle-question info-question"
                        >
                    </cargo-field>
                 </div>
            </div>
        </div>

        <div class="field-container">
            <!-- <div class="field-group col-5">
                <div class="field-col"></div>
                <button type="button" id="voltarBtn"    class="cta-button" data-translate="lbl_voltarBtn">Voltar</button>
            </div>    -->
            <div class="field-group col-0">
                <div class="field-col"></div>
                <button type="button" id="cadastrarBtn" class="cta-button" data-translate="lbl_cadastrarBtn">Salvar</button>
            </div>
        </div>
    
    
    </form>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script type="module" src="../script/core/theme-engine.js"></script>
    <script type="module" src="../script/components/form/cargo/Cargo_Field.js"></script>

    <script type="module" src="../script/pages/pastoral/cargo.js"></script>
    
        
    
</body>
</html>
